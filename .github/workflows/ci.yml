name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@v4

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore ".\Mac1ota Menu.csproj"

    - name: Build
      run: dotnet build ".\Mac1ota Menu.csproj" --no-restore -c Debug -p:Platform=x64

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: legitbaratinho-debug
        path: |
          bin/x64/Debug/net10.0-windows7.0/
