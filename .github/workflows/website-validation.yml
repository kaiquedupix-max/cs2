name: Website validation

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-validation.yml"
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/website-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check checkoutRoutes.js
          node --check mercadoPago.js
          node --check geoMarket.js
          node --check geoMarket.test.js
          node --check public/landing.js
          node --check public/checkout.js
          node --check public/checkout-i18n.js
          node --check public/account.js
          node --check public/admin.js
          node --check public/support.js
          node --check productRegistry.js
          node --check releaseManifest.js
          node --check releaseTrust.js
          node --check tools/make-attestation.mjs
      - name: Test server-enforced IP pricing
        run: node --test geoMarket.test.js
      - name: Validate product prices without changing CS2
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { checkoutPlan, checkoutConfig } from "./mercadoPago.js";
          assert.equal(checkoutPlan("d30", "counterframe").priceCents, 3500);
          assert.equal(checkoutPlan("d15", "counterframe").priceCents, 2190);
          assert.equal(checkoutPlan("d7", "counterframe").priceCents, 1290);
          assert.equal(checkoutPlan("d1", "counterframe").priceCents, 490);
          assert.equal(checkoutPlan("d30", "cs2").priceCents, 1990);
          assert.equal(checkoutPlan("d90", "cs2").priceCents, 3990);
          assert.equal(checkoutPlan("lifetime", "counterframe"), null);
          assert.equal(checkoutConfig("counterframe").plans.length, 4);
          assert.equal(checkoutPlan("d30", "counterframe").usdPriceCents, 1000);
          assert.equal(checkoutPlan("d15", "counterframe").usdPriceCents, 700);
          assert.equal(checkoutPlan("d7", "counterframe").usdPriceCents, 400);
          assert.equal(checkoutPlan("d1", "counterframe").usdPriceCents, 150);
          assert.equal(checkoutConfig("counterframe","INTL").configured, false);
          process.env.CF_USD_BRL_RATE="5";
          assert.equal(checkoutPlan("d30","counterframe","INTL").priceCents, 5000);
          assert.equal(checkoutPlan("d30","cs2","INTL").priceCents, 1990);
          console.log("Checkout plans OK.");
          NODE
      - name: Install dependencies
        run: |
          npm ci
          npm i --no-save @electric-sql/pglite-socket
      - name: Platform tests (registry, signed releases, disable/rollback, licenses)
        run: node platform.integration.test.mjs
      - name: Regression tests (CS2, Combat Arms Brasil Server, checkout, admin)
        run: node cabr.integration.test.mjs
